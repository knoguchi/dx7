[package]
name = "dx7-esp32s3"
version = "0.1.0"
edition = "2021"

[dependencies]
dx7-core = { path = "../dx7-core", default-features = false }
dx7-midi = { path = "../dx7-midi" }
esp-hal = { version = "1.0.0", features = ["esp32s3", "unstable"] }
esp-println = { version = "0.16", default-features = false, features = ["esp32s3", "uart"] }
esp-backtrace = { version = "0.18", features = ["esp32s3", "panic-handler", "println"] }
esp-alloc = "0.9"
esp-radio = { version = "0.17", default-features = false, features = ["esp32s3", "ble", "unstable"], optional = true }
esp-rtos = { version = "0.2", features = ["esp-radio", "embassy", "esp32s3"], optional = true }
trouble-host = { version = "0.5.1", default-features = false, features = ["peripheral", "gatt", "derive", "default-packet-pool", "default-packet-pool-mtu-255"], optional = true }
embassy-executor = { version = "0.9", optional = true }
embassy-futures = { version = "0.1", optional = true }
embassy-sync = { version = "0.7", optional = true }
# Time driver is provided by esp-rtos (feature "embassy", tick-hz-1_000_000).
embassy-time = { version = "0.5", optional = true }
embassy-usb = { version = "0.5", optional = true }
# Not referenced in src/ directly, but trouble-host's #[gatt_server] macro
# expands to `static_cell::StaticCell`, so the ble-midi build needs it.
static_cell = { version = "2.1", optional = true }
gc9a01-rs = { version = "0.4", default-features = false, features = ["graphics"], optional = true }
display-interface-spi = { version = "0.5", optional = true }
embedded-graphics = { version = "0.8", optional = true }
embedded-hal = { version = "1.0", optional = true }
embedded-hal-bus = { version = "0.2", optional = true }
esp-bootloader-esp-idf = { version = "0.4.0", features = ["esp32s3"] }

[features]
qemu = []
pwm = []
es8311 = []
ble-midi = ["dep:esp-radio", "dep:esp-rtos", "dep:trouble-host", "dep:embassy-executor", "dep:embassy-futures", "dep:embassy-sync", "dep:embassy-time", "dep:static_cell"]
usb-midi = ["dep:esp-rtos", "dep:embassy-executor", "dep:embassy-futures", "dep:embassy-sync", "dep:embassy-time", "dep:embassy-usb"]
# Touch (CST816D) is driven with raw I2C reads in src/lcd.rs; no cst816s crate.
lcd = ["dep:gc9a01-rs", "dep:display-interface-spi", "dep:embedded-graphics", "dep:embedded-hal", "dep:embedded-hal-bus"]

# patches/esp-rom-sys is generated by `bash patches/apply.sh` (gitignored).
# Until it exists, `cargo build`/`cargo fetch` fail to resolve this patch.
[patch.crates-io]
esp-rom-sys = { path = "patches/esp-rom-sys" }

[profile.release]
opt-level = 3
lto = true
strip = true
